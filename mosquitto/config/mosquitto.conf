# Broker MQTT del laboratorio
listener 1883 0.0.0.0

# Laboratorio local: sin usuario/contraseña.
# Para exigir credenciales:
#   1. mosquitto_passwd -c mosquitto/config/passwd esp32cam-01
#   2. Cambia allow_anonymous a false y descomenta password_file
allow_anonymous true
#password_file /mosquitto/config/passwd

# 14 MB: una imagen de 10 MB enviada en Base64 (+33 %) cabe en un mensaje.
# El límite real de 10 MB por imagen lo valida la API.
max_packet_size 14680064

persistence true
persistence_location /mosquitto/data/
log_dest stdout
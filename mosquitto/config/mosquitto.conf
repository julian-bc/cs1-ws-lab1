# Broker MQTT del laboratorio
listener 1883 0.0.0.0
 
# Laboratorio local: sin usuario/contraseña.
# Para exigir credenciales:
#   1. mosquitto_passwd -c mosquitto/config/passwd esp32cam-01
#   2. Cambia allow_anonymous a false y descomenta password_file
allow_anonymous true
#password_file /mosquitto/config/passwd
 
# Las imágenes viajan en un solo mensaje: hasta 5 MB, igual que la API HTTP.
max_packet_size 5242880
 
persistence true
persistence_location /mosquitto/data/
log_dest stdout